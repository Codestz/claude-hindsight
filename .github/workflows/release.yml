name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            use_cross: false
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build frontend
        run: cd web && npm install && npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE="claude-hindsight-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" claude-hindsight
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ARCHIVE = "claude-hindsight-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/claude-hindsight.exe" -DestinationPath $ARCHIVE
          echo "ARCHIVE=$ARCHIVE" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build frontend
        run: cd web && npm install && npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --allow-dirty --token ${{ secrets.CRATES_IO_TOKEN }}

  homebrew:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Wait for release assets to be available
        run: sleep 30

      - name: Download release assets and compute SHAs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            ASSET="claude-hindsight-${target}.tar.gz"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir /tmp/dl
            SHA=$(sha256sum "/tmp/dl/$ASSET" | awk '{print $1}')
            # Convert target to env-friendly name: aarch64-apple-darwin -> SHA_AARCH64_APPLE_DARWIN
            ENV_NAME="SHA_$(echo "$target" | tr '[:lower:]-' '[:upper:]_')"
            echo "${ENV_NAME}=${SHA}" >> "$GITHUB_ENV"
          done

      - name: Generate formula
        run: |
          cat > /tmp/claude-hindsight.rb <<FORMULA
          class ClaudeHindsight < Formula
            desc "20/20 hindsight for your Claude Code sessions"
            homepage "https://github.com/Codestz/claude-hindsight"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Codestz/claude-hindsight/releases/download/v#{version}/claude-hindsight-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_APPLE_DARWIN}"
              else
                url "https://github.com/Codestz/claude-hindsight/releases/download/v#{version}/claude-hindsight-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_APPLE_DARWIN}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Codestz/claude-hindsight/releases/download/v#{version}/claude-hindsight-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_AARCH64_UNKNOWN_LINUX_GNU}"
              else
                url "https://github.com/Codestz/claude-hindsight/releases/download/v#{version}/claude-hindsight-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_64_UNKNOWN_LINUX_GNU}"
              end
            end

            def install
              bin.install "claude-hindsight"
            end

            test do
              system "#{bin}/claude-hindsight", "--version"
            end
          end
          FORMULA
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/claude-hindsight.rb

      - name: Push formula to homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -e
          CONTENT=$(base64 -w 0 /tmp/claude-hindsight.rb)
          # Get current file SHA
          RESPONSE=$(curl -sf \
            -H "Authorization: token $TAP_TOKEN" \
            "https://api.github.com/repos/Codestz/homebrew-tap/contents/Formula/claude-hindsight.rb")
          FILE_SHA=$(echo "$RESPONSE" | jq -r '.sha')

          if [ "$FILE_SHA" = "null" ] || [ -z "$FILE_SHA" ]; then
            echo "::error::Failed to get file SHA from tap repo. Check HOMEBREW_TAP_TOKEN."
            exit 1
          fi

          RESULT=$(curl -sf -X PUT \
            -H "Authorization: token $TAP_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Codestz/homebrew-tap/contents/Formula/claude-hindsight.rb" \
            -d "{\"message\":\"chore: bump to v${VERSION}\",\"content\":\"${CONTENT}\",\"sha\":\"${FILE_SHA}\"}")

          echo "Successfully updated tap formula to v${VERSION}"
          echo "$RESULT" | jq '.commit.sha'
