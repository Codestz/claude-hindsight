[package]
name = "hindsight"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Codestz <est.estrada@outlook.com>"]
description = "20/20 hindsight for your Claude Code sessions"
homepage = "https://github.com/Codestz/claude-hindsight"
repository = "https://github.com/Codestz/claude-hindsight"
license = "MIT"
keywords = ["claude", "observability", "cli", "terminal-ui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }

# JSON parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# File watching
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }

# Terminal UI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-tree-widget = "0.22"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
toml = "0.8"

# Performance
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.12"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0

[lib]
name = "hindsight"
path = "src/lib.rs"


[[bin]]
name = "hindsight"
path = "src/main.rs"
